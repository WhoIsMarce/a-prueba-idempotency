services:
  db:
    image: postgres:17-alpine
    container_name: a-prueba-idempotency-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: idempotency_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d idempotency_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: